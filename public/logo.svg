<svg viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#152238"/>
    </linearGradient>
    <linearGradient id="pgrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- badge -->
  <g transform="translate(10,10)">
    <rect x="0" y="0" width="200" height="200" rx="42" fill="url(#bg)"/>
    <rect x="0" y="0" width="200" height="200" rx="42" fill="none" stroke="#0ea5e9" stroke-opacity="0.35" stroke-width="1.5"/>

    <g stroke="#38bdf8" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.9">
      <path d="M22 40 V26 a3 3 0 0 1 3 -3 H40"/>
      <path d="M160 23 H174 a3 3 0 0 1 3 3 V40"/>
      <path d="M177 160 V174 a3 3 0 0 1 -3 3 H160"/>
      <path d="M40 177 H26 a3 3 0 0 1 -3 -3 V160"/>
    </g>

    <g filter="url(#glow)">
      <rect x="75" y="53" width="12" height="94" rx="6" fill="url(#pgrad)"/>
      <path d="M87 53 h23 a23 23 0 0 1 0 46 h-23"
            fill="none" stroke="url(#pgrad)" stroke-width="12" stroke-linecap="round"/>
      <path d="M129 76 h13" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
      <circle cx="147" cy="76" r="5" fill="#a5f3fc"/>
      <circle cx="81" cy="147" r="4.5" fill="#e0f2fe"/>
    </g>
  </g>

  <!-- wordmark -->
  <text x="238" y="128" font-family="'JetBrains Mono','Courier New',monospace" font-size="64" font-weight="700" letter-spacing="2" fill="url(#textGrad)">PRIORITRON</text>
  <text x="240" y="160" font-family="'JetBrains Mono','Courier New',monospace" font-size="20" letter-spacing="6" fill="#0ea5e9" fill-opacity="0.75">PRIORITIZE.EXECUTE.</text>
</svg>
