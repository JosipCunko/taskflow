<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#152238"/>
    </linearGradient>
    <linearGradient id="pgrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- badge -->
  <rect x="8" y="8" width="496" height="496" rx="96" fill="url(#bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="96" fill="none" stroke="#0ea5e9" stroke-opacity="0.35" stroke-width="2"/>

  <!-- faint circuit grid -->
  <g stroke="#0ea5e9" stroke-opacity="0.08" stroke-width="1.5">
    <line x1="8" y1="171" x2="504" y2="171"/>
    <line x1="8" y1="341" x2="504" y2="341"/>
    <line x1="171" y1="8" x2="171" y2="504"/>
    <line x1="341" y1="8" x2="341" y2="504"/>
  </g>

  <!-- HUD corner brackets -->
  <g stroke="#38bdf8" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.9">
    <path d="M56 92 V60 a4 4 0 0 1 4 -4 H92"/>
    <path d="M420 56 H452 a4 4 0 0 1 4 4 V92"/>
    <path d="M456 420 V452 a4 4 0 0 1 -4 4 H420"/>
    <path d="M92 456 H60 a4 4 0 0 1 -4 -4 V420"/>
  </g>

  <!-- P monogram, built as a circuit trace -->
  <g filter="url(#glow)">
    <!-- spine -->
    <rect x="192" y="136" width="30" height="240" rx="14" fill="url(#pgrad)"/>
    <!-- bowl of the P, open circuit-style loop -->
    <path d="M222 136
             h58
             a58 58 0 0 1 0 116
             h-58"
          fill="none" stroke="url(#pgrad)" stroke-width="30" stroke-linecap="round"/>
    <!-- circuit trace leaving the bowl -->
    <path d="M328 194 h34" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
    <circle cx="374" cy="194" r="12" fill="#a5f3fc"/>
    <!-- node at base of spine -->
    <circle cx="207" cy="376" r="10" fill="#e0f2fe"/>
  </g>
</svg>
